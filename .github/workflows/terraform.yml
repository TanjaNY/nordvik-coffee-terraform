name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write        # OIDC token for AWS
  contents: read         # Checkout code
  pull-requests: write   # Post plan as PR comment

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::581137949655:role/nordvik-coffee-github-actions-role
  TF_VERSION: 1.5.0
  TF_IN_AUTOMATION: "true"

# Prevents two runs on the same branch from modifying state simultaneously
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const max = 60000;
            let plan = process.env.PLAN || '';
            if (plan.length > max) plan = plan.slice(0, max) + '\n\n... (truncated)';
            const body = [
              `#### Terraform Format and Style 🖌 \`${{ steps.fmt.outcome }}\``,
              `#### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\``,
              `#### Terraform Validation 🤖 \`${{ steps.validate.outcome }}\``,
              `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\``,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              `*Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Plan Summary
        if: always()
        run: |
          echo "✅ Terraform Plan Complete"
          echo ""
          echo "📋 This workflow runs 'terraform plan' only."
          echo "🔒 No automatic deployment to keep infrastructure safe."
          echo "📚 For learning: See how CI/CD validates infrastructure changes."
          echo ""
          echo "To deploy manually:"
          echo "  1. Run 'aws login' locally"
          echo "  2. Run 'terraform apply' from your machine"

  # Apply job is disabled for educational/safety purposes
